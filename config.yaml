fomo:
  base_url: https://prod-api.fomo.family
  app_url: https://fomo.family/
  supported_chains: "1,56,143,4663,5042,8453,1399811149"
  network_id: "1399811149"      # Solana
  feed_limit: 50                # -record mode
  # For API requests. Copy the real one from your browser (DevTools → Network → any
  # request → User-Agent). Headless Chrome (session.mode=chromedp) uses its own.
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
  request_timeout: 10s
  rate_limit_rps: 1             # per account, unless the account sets its own rps
  max_retries: 5
  # "threshold" of /feed/token/thesis (-record mode).
  thesis_threshold: "0"

session:
  mode: chromedp                  # static | chromedp
  # chromedp: each account is a Chrome you start yourself, with its own profile
  # and --remote-debugging-port. The bot attaches. It does not launch Chrome
  # and it does not refresh Privy. Log in with `fomobot -login -account acc01`
  # (Google sign-in has no debug port), then reopen that profile with the port
  # and leave the window open.
  # static: token copied from localStorage["privy:token"].
  chrome_path: "${FOMO_CHROME_PATH}"
  headless: true
  no_sandbox: ${FOMO_CHROME_NO_SANDBOX}
  refresh_before_expiry: 5m
  page_load_timeout: 60s
  chrome_concurrency: 4
  # Used only when the accounts list below is empty.
  access_token: "${FOMO_ACCESS_TOKEN}"
  token_file: ./token.txt
  chrome_profile_dir: ./profiles/acc01

# Twenty-three Fomo accounts, the same shape as fomo-thesis-tester.
# acc01 -> 9221 ... acc23 -> 9243.
# API calls run inside the open fomo.family tab, so these accounts do not use
# the Go proxy. Which accounts answer: GET /health/accounts.
